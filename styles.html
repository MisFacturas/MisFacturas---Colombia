<style>
/* ============================================================
   misfacturas add-on — theme
   Self-contained: no CSS, font or image is fetched from any
   company server. Palette sampled from the published add-on
   screenshots so it matches the pre-outage design.
   ============================================================ */
:root{
  --mf-brand:#F26522;        /* header band, primary buttons */
  --mf-brand-dark:#D4551A;   /* hover / active */
  --mf-brand-soft:#FFEAE4;   /* tinted secondary buttons */
  --mf-dark:#212529;         /* dark buttons */
  --mf-border:#dee2e6;
  --mf-muted:#6c757d;
}
body{font-family:Roboto,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--mf-dark)}

/* ---- brand overrides on top of Bootstrap ---- */
.bg-primary{background-color:var(--mf-brand)!important}
.text-primary{color:var(--mf-brand)!important}
.border-primary{border-color:var(--mf-brand)!important}
.btn-primary{--bs-btn-bg:var(--mf-brand);--bs-btn-border-color:var(--mf-brand);--bs-btn-hover-bg:var(--mf-brand-dark);--bs-btn-hover-border-color:var(--mf-brand-dark);--bs-btn-active-bg:var(--mf-brand-dark);--bs-btn-active-border-color:var(--mf-brand-dark);--bs-btn-disabled-bg:var(--mf-brand);--bs-btn-disabled-border-color:var(--mf-brand)}
.btn-outline-primary{--bs-btn-color:var(--mf-brand);--bs-btn-border-color:var(--mf-brand);--bs-btn-hover-bg:var(--mf-brand);--bs-btn-hover-border-color:var(--mf-brand);--bs-btn-active-bg:var(--mf-brand);--bs-btn-active-border-color:var(--mf-brand)}
.btn-dark{--bs-btn-bg:var(--mf-dark);--bs-btn-border-color:var(--mf-dark)}
a{color:var(--mf-brand)}

/* ---- header band with the logo (measured 76px tall) ---- */
#logo{background-color:var(--mf-brand);padding:.9rem 1rem;text-align:center}
#logo img{max-height:44px;width:auto;max-width:100%}

/* ---- buttons: centered, rounded 10px, icon on the left ---- */
.btn{border-radius:10px;font-weight:600}
.btn-lg{padding:.7rem 1.4rem;font-size:1rem}
.btn i[class*="icon-"]{margin-right:.55rem}
.btn-container{display:flex;flex-direction:column;align-items:center}
.btn-container .btn{width:100%;max-width:300px;margin-bottom:10px}
.btn-fluid{width:100%;display:block}
.btn-menu{display:flex;align-items:center;justify-content:center;gap:.55rem;width:100%;max-width:210px;margin:0 auto .75rem;padding:.7rem 1rem;border-radius:10px}
.btn-soft{background:var(--mf-brand-soft);color:var(--mf-brand);border:0}
.btn-soft:hover{background:#FFDCD2;color:var(--mf-brand-dark)}

/* ---- typography ---- */
.fs-7{font-size:.875rem}
.assistant-container,.text-container{padding:.5rem 1rem;text-align:center}
.text-container p{margin-bottom:.35rem}

/* ---- misc components ---- */
.result-box{border:1px solid var(--mf-border);border-radius:.5rem;padding:.75rem;background:#f8f9fa;max-height:320px;overflow-y:auto}
.remove-btn{border:0;background:transparent;color:#dc3545;cursor:pointer;padding:0 .25rem;line-height:1}
.spinner-container{display:flex;justify-content:center;align-items:center;padding:2rem}

/* ---- modals (no Bootstrap JS: the app uses its own) ---- */
.mf-modal-overlay,#app-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1050}
.mf-modal,#app-modal{background:#fff;border-radius:.6rem;max-width:92%;width:340px;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.2);overflow:hidden}
.mf-modal-header,.app-modal-header{padding:1rem 1.15rem .5rem;font-size:1.25rem;font-weight:400}
.mf-modal-body,.app-modal-body{padding:.5rem 1.15rem 1rem}
.mf-modal-footer,.app-modal-footer{padding:.5rem 1.15rem 1rem;display:flex;justify-content:flex-end;gap:1.25rem;align-items:center}
.mf-modal-footer .btn-link,.app-modal-footer .btn-link{text-decoration:none;font-weight:600;padding:0}

/* ---- icons: inline SVG masks, inherit currentColor ---- */
i[class*="icon-"]{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.2em;background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
